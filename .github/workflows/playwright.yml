
name: Playwright Tests (API & UI)
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do Repositório
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.18.0 # Ou a versão que usas localmente (14+, 20, etc.)
        cache: 'npm'

    - name: Instalar Dependências do Projeto
      run: npm install

    - name: Instalar Apenas o Browser Chromium
      run: npx playwright install chromium --with-deps

    - name: Iniciar o Servidor da Aplicação (Background)
      run: |
        npm start > server.log 2>&1 &
        SERVER_PID=$!
        echo $SERVER_PID > server.pid
        
        # Wait for server with better timeout handling
        for i in {1..30}; do
          if curl -f http://localhost:3000/login.html > /dev/null 2>&1; then
            echo "Server is ready"
            break
          fi
          echo "Waiting for server... (attempt $i/30)"
          sleep 1
        done
        
        if ! curl -f http://localhost:3000/login.html > /dev/null 2>&1; then
          echo "Server failed to start"
          cat server.log
          exit 1
        fi

    - name: Executar a Suíte de Testes (56 CTs)
      run: npx playwright test --project=chromium --workers=1
      
    - name: Print Server Logs on Failure
      if: failure()
      run: cat server.log
    - name: Carregar Relatório do Playwright (Artifacts)
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30